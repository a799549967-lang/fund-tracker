name: Fetch Fund Data

on:
  schedule:
    # Every 5 min, Mon-Fri 01:30-07:30 UTC = CST 09:30-15:30
    - cron: '*/5 1-7 * * 1-5'
    # Also run at CST 09:30 and 13:00 sharp
    - cron: '30 1 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch fund data
        run: python scripts/fetch_funds.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update fund data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
